name: Bug report
description: Report a defect in FuVR
title: "[bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in as much as you can — partial reports are still useful.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model & macOS version
      placeholder: "MacBook Pro M3 Pro, macOS 15.2"
  - type: input
    id: quest
    attributes:
      label: Quest model & system version
      placeholder: "Quest 3, v74"
  - type: input
    id: fuvr_version
    attributes:
      label: FuVR version / commit
      placeholder: "0.1.0 or abcdef0"
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      render: shell
  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct.
          required: true
