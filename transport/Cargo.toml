[workspace]
resolver = "2"
members = [
    "transport-core",
    "transport-usb",
    "transport-udp",
    "transport-cli",
    "transport-ffi",
    "transport-mdns",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["FuVR contributors"]
repository = "https://github.com/fuvr/fuvr"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
bytes = "1.7"
tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["codec"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
reed-solomon-erasure = "6.0"
capnp = "0.20"
capnpc = "0.25"
async-trait = "0.1"
parking_lot = "0.12"
rand = "0.8"
if-addrs = "0.13"
